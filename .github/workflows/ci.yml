name: Checks
on:
  push:
  pull_request:
  # Deploys both Workers from main by hand, e.g. after rotating the token.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm test:dev
      - run: pnpm verify

  self-hosted-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      WALDEN_TEST_POSTGRES: '1'
      WALDEN_TEST_BROWSER: '1'
      WALDEN_TEST_WORKER_BUNDLE: '1'
      WALDEN_TEST_NATIVE_PURGE_BROKER: '1'
      EMBEDDING_MODEL_DIR: /tmp/walden-minilm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @walden/contracts build && pnpm --filter @walden/domain build
      - run: node apps/api/scripts/download-embedding-model.mjs /tmp/walden-minilm
      - run: pnpm --filter @walden/api exec playwright install --with-deps chromium
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:self-hosted
      - run: pnpm --filter @walden/api build
      - run: pnpm --filter @walden/api exec vitest run src/platform/node src/execution/production-worker.workerd.test.ts src/execution/purge.test.ts --maxWorkers=2
      - name: Start disposable object storage for provider tests
        env:
          SEAWEEDFS_PORT: '18334'
          APP_URL: '*'
        run: docker compose --env-file /dev/null -p walden-ci-provider-matrix --profile postgres up -d --wait seaweedfs
      - name: Browser and API provider matrix
        env:
          WALDEN_TEST_S3_ENDPOINT: http://127.0.0.1:18334
        run: pnpm test:providers --skip-build
      - name: Standalone development hot reload and shutdown
        run: pnpm test:dev:smoke
      - name: Provider test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: provider-matrix
          path: |
            playwright-report/provider-matrix
            test-results/provider-matrix
          if-no-files-found: ignore
      - name: Remove disposable provider storage
        if: always()
        run: docker compose --env-file /dev/null -p walden-ci-provider-matrix --profile postgres down --volumes

  # Manual deployment selects the changed deployables. Main pushes only run checks.
  changes:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            landing:
              - 'apps/landing/**'
              - 'pnpm-lock.yaml'

  # The Worker applies bundled D1 migrations during initialization before
  # serving requests or scheduled work. No separate migration job is needed.
  deploy-app:
    needs: [verify, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    environment:
      name: production
      url: https://chat.withwalden.app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip without a deploy token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec turbo run build --filter=@walden/api
      - name: Deploy the walden Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        run: pnpm exec wrangler deploy

  deploy-landing:
    needs: [verify, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    environment:
      name: production
      url: https://withwalden.app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip without a deploy token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec turbo run build --filter=@walden/landing
      - name: Deploy the walden-landing Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/landing
        run: pnpm exec wrangler deploy
