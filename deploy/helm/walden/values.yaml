image:
  repository: ''
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Existing secret: DATABASE_URL, VALKEY_URL, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY, BETTER_AUTH_SECRET and optional inference credentials.
externalSecretName: ''
config:
  APP_URL: ''
  AUTH_MODE: better-auth
  FILE_STORAGE: s3
  S3_ENDPOINT: ''
  S3_PUBLIC_ENDPOINT: ''
  S3_BUCKET: ''
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: 'false'
http:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '2', memory: 2Gi }
worker:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: '4', memory: 4Gi }
scheduler:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 1Gi }
service:
  port: 80
terminationGracePeriodSeconds: 60
# Install deploy/docker/chromium-oci-seccomp.json on every worker node under
# /var/lib/kubelet/seccomp/profiles/walden-chromium.json (or your kubelet root).
seccompProfile:
  type: Localhost
  localhostProfile: profiles/walden-chromium.json
nodeSelector: {}
tolerations: []
affinity: {}
ingress:
  annotations: {}
  enabled: false
  className: ''
  host: ''
  tlsSecretName: ''
