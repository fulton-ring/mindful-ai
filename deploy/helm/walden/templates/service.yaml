apiVersion: v1
kind: Service
metadata:
  name: {{ include "walden.name" . }}
  labels:
    {{- include "walden.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: http
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
