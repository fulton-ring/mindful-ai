x-runtime: &runtime
  image: walden:local
  build: .
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp:./deploy/docker/chromium-seccomp.json
  tmpfs:
    - /tmp:mode=1777,size=512m
  shm_size: 512mb
  stop_grace_period: 60s
  env_file:
    - path: .env.self-hosted
      required: false

x-distributed-env: &distributed-env
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: postgres://walden:${POSTGRES_PASSWORD:-walden-local}@postgres:5432/walden
  VALKEY_URL: redis://valkey:6379
  FILE_STORAGE: s3
  S3_ENDPOINT: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${SEAWEEDFS_PORT:-8333}}
  S3_REGION: us-east-1
  S3_BUCKET: walden
  S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-walden-local}
  S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-walden-local-password}
  S3_FORCE_PATH_STYLE: 'true'

x-distributed-depends: &distributed-depends
  migrate:
    condition: service_completed_successfully
  valkey:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy

services:
  app:
    <<: *runtime
    ports: ['127.0.0.1:${PORT:-3000}:3000']
    environment:
      APP_ROLE: all
      APP_URL: ${APP_URL:-http://localhost:3000}
      FILE_STORAGE: local
    volumes: [walden-data:/data]

  postgres:
    profiles: [postgres]
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: walden
      POSTGRES_USER: walden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walden-local}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U walden -d walden']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    profiles: [postgres]
    image: valkey/valkey:8-bookworm
    restart: unless-stopped
    command: [valkey-server, --appendonly, 'yes']
    volumes: [valkey-data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    profiles: [postgres]
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.allowedOrigins=${APP_URL:-http://localhost:3000}
    ports: ['127.0.0.1:${SEAWEEDFS_PORT:-8333}:8333']
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-walden-local}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-walden-local-password}
      S3_BUCKET: walden
    volumes: [seaweedfs-data:/data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://localhost:8888/buckets/walden/?limit=1']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *runtime
    profiles: [postgres]
    restart: 'no'
    environment:
      <<: *distributed-env
      APP_ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  http:
    <<: *runtime
    profiles: [postgres]
    ports: ['127.0.0.1:${PORT:-3000}:3000']
    environment:
      <<: *distributed-env
      APP_ROLE: http
    depends_on: *distributed-depends

  worker:
    <<: *runtime
    profiles: [postgres]
    environment:
      <<: *distributed-env
      APP_ROLE: worker
    depends_on: *distributed-depends

  scheduler:
    <<: *runtime
    profiles: [postgres]
    environment:
      <<: *distributed-env
      APP_ROLE: scheduler
    depends_on: *distributed-depends

volumes:
  walden-data:
  postgres-data:
  valkey-data:
  seaweedfs-data:
